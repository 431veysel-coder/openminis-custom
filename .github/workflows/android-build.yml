name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile & gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build rclone.aar
        run: |
          mkdir -p src/android/app/libs
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./deps/build_rclone_android.sh
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Grant execute permission for gradlew
        run: |
          cd src/android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd src/android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (Unsigned)
        run: |
          cd src/android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/android/app/build/outputs/apk/github/debug/app-github-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: src/android/app/build/outputs/apk/github/release/app-github-release-unsigned.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src/android/app/build/outputs/apk/github/release/app-github-release-unsigned.apk
            src/android/app/build/outputs/apk/github/debug/app-github-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
