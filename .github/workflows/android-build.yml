name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true -Dorg.gradle.caching=true -Dkotlin.incremental=true -Dkotlin.daemon.jvm.options=-Xmx3g"
  JAVA_TOOL_OPTIONS: "-Xmx3g"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12433566

jobs:
  # Job 1: Native Dependencies (ayrı cache'lenebilir, nadiren değişir)
  native-deps:
    name: Build Native Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      proot-hash: ${{ steps.hash-proot.outputs.hash }}
      rclone-hash: ${{ steps.hash-rclone.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache PRoot build
        id: cache-proot
        uses: actions/cache@v4
        with:
          path: |
            assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot*.so
          key: ${{ runner.os }}-proot-${{ hashFiles('deps/build_proot.sh', 'deps/proot/**') }}
          restore-keys: |
            ${{ runner.os }}-proot-

      - name: Cache Alpine rootfs
        id: cache-rootfs
        uses: actions/cache@v4
        with:
          path: assets/alpine-minirootfs.tar.gz
          key: ${{ runner.os }}-alpine-rootfs-${{ hashFiles('scripts/prepare_android_sandbox.sh') }}
          restore-keys: |
            ${{ runner.os }}-alpine-rootfs-

      - name: Cache Rclone AAR
        id: cache-rclone
        uses: actions/cache@v4
        with:
          path: |
            deps/build/rclone/rclone.aar
            src/android/app/libs/rclone.aar
          key: ${{ runner.os }}-rclone-${{ hashFiles('deps/build_rclone_android.sh', 'deps/rclone-mobile/**') }}
          restore-keys: |
            ${{ runner.os }}-rclone-

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Install gomobile and gobind
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init

      - name: Build PRoot (if cache missed)
        if: steps.cache-proot.outputs.cache-hit != 'true'
        run: |
          chmod +x deps/build_proot.sh
          ./deps/build_proot.sh

      - name: Prepare Alpine Sandbox (if cache missed)
        if: steps.cache-rootfs.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          ./scripts/prepare_android_sandbox.sh

      - name: Build Rclone AAR (if cache missed)
        if: steps.cache-rclone.outputs.cache-hit != 'true'
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Calculate hashes for outputs
        id: hash-proot
        run: |
          echo "hash=$(sha256sum assets/proot-aarch64 src/android/app/src/main/jniLibs/arm64-v8a/libproot*.so 2>/dev/null | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Calculate rclone hash
        id: hash-rclone
        run: |
          echo "hash=$(sha256sum src/android/app/libs/rclone.aar 2>/dev/null | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-deps
          path: |
            assets/proot-aarch64
            src/android/app/src/main/jniLibs/arm64-v8a/libproot*.so
            assets/alpine-minirootfs.tar.gz
            src/android/app/libs/rclone.aar
          retention-days: 7

  # Job 2: Gradle Build (native deps bittikten sonra başlar)
  gradle-build:
    name: Build APK with Gradle
    runs-on: ubuntu-latest
    needs: native-deps
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Gradle (dependency + build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/daemon
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties', 'src/android/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure Gradle for speed
        working-directory: src/android
        run: |
          chmod +x gradlew
          # Gradle daemon'ı önceden başlat (cache ısınması)
          ./gradlew --version --no-daemon 2>&1 | tail -5

      - name: Build Debug APK (optimized flags)
        working-directory: src/android
        run: |
          ./gradlew :app:assembleDebug \
            --configuration-cache \
            --build-cache \
            --configure-on-demand \
            --parallel \
            --no-daemon \
            -Pandroid.enablePngCruncher=false \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.workers.max=2 \
            --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # Job 3: Quick verification (opsiyonal, paralel çalışabilir)
  verify-apk:
    name: Verify APK
    runs-on: ubuntu-latest
    needs: gradle-build
    timeout-minutes: 5
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: .

      - name: Verify APK structure
        run: |
          unzip -l app-debug.apk | head -30
          echo "APK size: $(du -h app-debug.apk | cut -f1)"
          # Check critical native libs
          unzip -l app-debug.apk | grep -E "(libproot|librclone|libjni)" || echo "Warning: Native libs may be missing"

      - name: Check package name
        run: |
          # aapt (legacy) veya aapt2 apkinfo ile package name doğrula
          if command -v aapt &> /dev/null; then
            aapt dump badging app-debug.apk | grep "package: name="
          else
            $ANDROID_HOME/build-tools/*/aapt2 apkinfo app-debug.apk | grep "package: name="
          fi