name: Build APK

# Original OpenMinis source, built unchanged except for identity
# (applicationId / label / our own signing key / self-update repo).
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [release, debug]
        default: release
  push:
    branches:
      - main
      # [37124] GERCEK BOSLUK: bu filtre yalniz `ozel-*` (tire) desenini
      # tasiyordu, ama calisma dali `ozel/16-duzeltmeler` (SLASH). Yani
      # `.35`-`.43` arasindaki DOKUZ surumun hicbiri CI'da **derlenmedi**:
      # `Slice Gate` yalniz dilim dosyalarini `kotlinc` ile derliyor ve
      # `ui/**` orada yok. Sonuc: `.41`'de silinen bir `private fun`
      # (`DecisionTab`) dokuz surum boyunca fark edilmedi; cagrisi duruyordu.
      # Derleme artik bu dalda da kosuyor; yayin karari degismiyor (surum
      # kapisi ayni versionCode'u iki kez yayinlatmiyor).
      - 'ozel/**'
      - 'ozel-*'
      # [MINIS-OZEL 11.4] A push to a feature branch publishes too. The user
      # asked for it in one sentence — "every APK that is ready becomes a
      # release" — and the version gate below is what keeps that safe: a build
      # whose versionCode was already published fails in ~15 s instead of
      # replacing a release nobody has installed yet. Debug builds never
      # publish, so a dispatch run stays a throwaway verification build.
    # [MINIS-OZEL] `tags: 'v*'` used to be here too, and every publish made it
    # fire again: action-gh-release creates the tag, the tag push starts a
    # second run for the same commit, and both try to write the same release.
    # `concurrency: apk-${{ github.ref }}` did not help — refs/tags/x and
    # refs/heads/main are different groups. Tags in this repo are an OUTPUT of
    # a release build, never an input, so the trigger is gone rather than
    # guarded. A manual tag now does nothing, which is the honest behaviour.
    # (The release gate below is the second line of defence.)
    # Code-only changes skip the 10-minute build; the docs are not shipped.
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  # [MINIS-X least-privilege 37094] Was `contents: write` for the WHOLE
  # workflow, which handed a write token to preflight, compile, tests and
  # native — four jobs that only read code and run checks. Only the build job
  # publishes a release, so only it gets write (see the job below). The
  # actions/* artifact steps keep working: they use the runtime token, not this
  # one.
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# [MINIS-X run-logs 37094] Every `run:` block is a bash script, and the long
# commands below are piped into `tee` so the log survives the runner.
#
# Two facts from the workflow-syntax docs, both load-bearing:
#   * shell unset (what this file used to be) runs `bash -e {0}` — NO pipefail.
#     So `gradlew | tee` returns tee's 0 even when gradle failed, and the job
#     goes green on a failed build.
#   * shell `bash` runs `bash --noprofile --norc -eo pipefail {0}` — WITH
#     pipefail, and without sourcing the runner's profile, which could inject
#     shell options we never asked for.
# The flags are spelled out rather than written as `shell: bash` so the file
# states what it gets instead of relying on a doc line someone has to remember.
#
# Consequence for every pipeline in this file: an early-exit consumer (`head`,
# `grep -q`) closes the pipe while the producer is still writing, the producer
# dies of SIGPIPE (141), and pipefail turns that into a red step. `| head -1`
# and `| grep -q` are therefore banned below; `sed -n '1,Np'`, `grep -c >/dev/null`
# and bash `case` read to EOF and cannot produce that failure.
defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  # [MINIS-X ci-cache] Pinned so the Go cache key does not churn on a toolchain
  # bump that was not intended.
  GO_VERSION: "1.25"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  # [MINIS-OZEL] Tests run in their OWN job, in parallel with the build.
  #
  # Why this is a separate job and not a step: the previous arrangement was a
  # step at the end of the build job that took 10.2 of the pipeline's 21.4
  # minutes, ran after the APK was already uploaded, and could not fail
  # anything (`continue-on-error: true`). It cost half the wall clock and
  # bought no enforcement. Moving it here costs nothing on the clock — it runs
  # on a second runner while the APK builds — and its result is now a real red
  # or green on the run.
  #
  # The fork's own tests (com.openminis.app.ozel.*) are the ones that must
  # pass: they cover features upstream has never seen, so the upstream suite
  # cannot catch their regressions. Upstream's 721 test files stay advisory —
  # a red upstream test is not our bug to hold a release for, and upstream
  # ships them non-blocking too.
  # [MINIS-OZEL 11.2] The pre-commit gate, verified independently.
  #
  # Runs FIRST and finishes in ~15 s, so a missing import or an unescaped XML
  # apostrophe fails the workflow in seconds instead of surfacing 4.5 minutes
  # later as "Unresolved reference" inside a Kotlin compile log. The same
  # script runs on the developer's machine as a pre-commit hook; this job is
  # what makes that a guarantee rather than a habit (a hook is not installed
  # in every clone, and `--no-verify` exists).
  #
  # Deliberately NOT `needs: native` — it has no Gradle or NDK dependency, and
  # putting it behind the 2-minute native layer would throw away the whole
  # point of a fast gate.
  preflight:
    name: Preflight (fast gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Self-test the checks
        # A check that silently stopped detecting anything is worse than no
        # check: it reports "clean" forever. --selftest feeds each check a
        # known-bad sample and fails if the check does not fire.
        run: python3 scripts/preflight.py --selftest

      - name: Run the gate
        # Watchdog: the wrapper enforces a hard 120 s limit and exits 2 (never
        # 0) if it is hit. A hung gate must not read as a passing one.
        env:
          PREFLIGHT_TIMEOUT: "120"
        run: sh scripts/preflight.sh

      - name: Fork gates (fast, ~10 s)
        # [37099] Bu dosyanın kendi kapıları — korpus, yapısal, çeviri, APK
        # bütçesi, harita. Hepsi `ozel-guard.yml`'de de var; burada da
        # koşuyorlar çünkü:
        #
        #  · `ozel-guard` ayrı bir iş akışı ve APK derlemesini BLOKLAMIYOR.
        #    Kırmızı bir korpus ya da bayat harita, 4 dakikalık derleme
        #    bittikten sonra "geçti" görünen bir APK üretirdi.
        #  · Burada 10 saniye; compile gate'ten sonra 4 dakika.
        #
        # `denetim` (audit, 48 sn) BİLEREK yok: import denetimi zaten
        # `Auditors` iş akışında ve burada onu beklemek preflight'ın
        # "saniyeler" sözünü bozar.
        run: python3 scripts/ozel/kapi.py korpus yapisal ceviri apk-butce harita entegrasyon etiket

  version-gate:
    name: Version gate (fast)
    # [MINIS-OZEL 11.4] Moved to its own job that runs BEFORE anything is
    # compiled. It used to be the last step of the build: a push carrying an
    # already-published versionCode spent six minutes building an APK, then
    # failed — and by then the artifact existed, so the failure read like a
    # release accident rather than the arithmetic mistake it was. Reading
    # versionName/versionCode out of build.gradle.kts needs no Gradle, no NDK
    # and no cache; the whole job is seconds.
    #
    # The publishing step keeps its own copy of the check. That is not
    # redundancy for its own sake: this job answers "may this run publish",
    # while the publishing step answers "may this exact APK replace that exact
    # asset". Two questions, two places they can be answered wrongly.
    if: ${{ (inputs.build_type || 'release') == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Refuse to publish a versionCode that already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          CODE=$(sed -n 's/^ *versionCode *= *\([0-9]\+\).*/\1/p' src/android/app/build.gradle.kts | sed -n '1p')
          NAME=$(sed -n 's/^ *versionName *= *"\([^"]*\)".*/\1/p' src/android/app/build.gradle.kts | sed -n '1p')
          [ -n "$CODE" ] || { echo "::error::could not read versionCode"; exit 1; }
          [ -n "$NAME" ] || { echo "::error::could not read versionName"; exit 1; }
          TAG="v$NAME"
          echo "gate: $TAG build $CODE"
          # [37094] `|| true` made this gate FAIL OPEN. An expired token or a
          # 403 answered exactly like "no release yet", so the one check that
          # protects a published versionCode passed silently on the errors
          # where it was most needed. "No such release" and "the query failed"
          # are now different outcomes, and only the first one is allowed.
          ERR=$(mktemp)
          set +e
          EXISTING=$(gh release view "$TAG" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' 2>"$ERR")
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -qiE 'not found|HTTP 404' "$ERR"; then
              echo "gate: no release for $TAG yet — allowed"
              exit 0
            fi
            echo "::error::could not query releases for $TAG (gh exit $RC):"
            sed -n '1,5p' "$ERR"
            echo "::error::refusing to publish on an unverified gate"
            exit 1
          fi
          OLD=$(echo "$EXISTING" | sed -n 's/.*-build\([0-9]*\)-.*/\1/p' | sed -n '1p')
          if [ -z "$OLD" ]; then
            echo "::error::$TAG exists without a build number in its asset name — refusing"
            exit 1
          fi
          if [ "$CODE" -le "$OLD" ]; then
            echo "::error::$TAG already published build $OLD; this tree says $CODE."
            echo "::error::Bump versionCode (and versionName) before pushing, or the"
            echo "::error::release would replace an APK nobody has installed yet."
            exit 1
          fi
          echo "gate: $OLD -> $CODE, allowed"

  # [MINIS-X fast-compile] The cheapest possible answer to "does this still
  # compile", placed BEFORE the expensive jobs.
  #
  # The complaint this fixes, in the user's words: an error meant starting over
  # from the top. A Kotlin type error surfaced after 5 minutes of unit tests and
  # then again after the APK step — twice per attempt. This job runs
  # `compileGithubDebugKotlin` and nothing else: no tests, no packaging, no
  # signing. On a warm Gradle cache it is ~90 s; on a cold one ~3 min, which is
  # still less than the tests job it prevents from running.
  #
  # It does NOT replace the tests. It runs first so a compile error is reported
  # once, in two minutes, instead of twice, in nine.
  compile:
    name: Compile gate (fast)
    # `native` is in `needs` because rclone.aar is a Gradle dependency: without
    # the artifact the compile cannot resolve its classpath and fails on
    # "Could not find :rclone:" — the slowest possible way to say nothing was
    # wrong with the Kotlin. Native runs in parallel with preflight, so the
    # cheap gate still starts ~90 s in.
    needs: [preflight, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore native deps
        # rclone.aar is a Gradle dependency (`flatDir app/libs`), so even a
        # COMPILE fails to resolve the classpath without it. Without this the
        # job would be the slowest possible way to report "Could not find
        # :rclone:".
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: src/android/app

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/android/.gradle
            src/android/app/build
          key: gradle-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/**/*.toml') }}
          restore-keys: |
            gradle-tests-
            gradle-

      - name: Raise JVM heap for the runner
        working-directory: src/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Compile only
        # `--no-daemon` keeps the runner from leaving a 6 GB Kotlin daemon
        # behind for the next step; the compile is one-shot here.
        working-directory: src/android
        run: |
          chmod +x gradlew
          # [37094] Same tee contract as the other Gradle steps: the file is
          # uploaded with `if: always()`, so a red compile can be read back
          # after the artifact expires from the Actions UI.
          LOG="$GITHUB_WORKSPACE/build/logs/compile.log"
          mkdir -p "$(dirname "$LOG")"
          # [H-013] 429/5xx artık "kod bozuk" sayılmıyor: sarmalayıcı ağ
          # hatasında 3 kez dener, gerçek hatada hemen düşer.
          bash ../../scripts/ci/gradle_retry.sh "$LOG" \
            ./gradlew :app:compileGithubDebugKotlin --build-cache --stacktrace

      # [37094] `if: always()` is the whole point: without it the upload step is
      # skipped exactly when the compile failed, i.e. when the log is the only
      # thing worth having. 90 days is the ceiling on a public repo.
      - name: Scrub secrets from the logs
        # [37094] GitHub masks secrets in the LIVE log stream only. These files
        # are the copy that survives, and artifact contents are not masked. A
        # `tee` that captures everything therefore needs a scrub before upload.
        if: always()
        continue-on-error: true
        run: python3 scripts/scrub_logs.py build/logs

      - name: Upload run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-compile
          path: build/logs/**
          retention-days: 90
          if-no-files-found: warn

      # [G2 37094] Room's schema JSON is a BUILD OUTPUT: KSP writes it to
      # `src/android/app/schemas/<db>/<version>.json` and it is not in the repo
      # for version 15. Without it, `MigrationTestHelper` cannot compare 14→15
      # and the next DB change has no baseline. Uploading it from the job that
      # already pays for KSP is the only way to obtain it without a local JDK
      # (this device has none — PRoot cannot mark pages executable).
      - name: Upload Room schemas
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: src/android/app/schemas/**
          retention-days: 90
          if-no-files-found: warn

  tests:
    name: Unit tests
    # `needs: native`, and not just for the wall clock: rclone.aar is a Gradle
    # dependency (flatDir app/libs), so even `testGithubDebugUnitTest` fails to
    # resolve the runtime classpath without it — "Could not find :rclone:.".
    # Starting after the native layer costs ~2 min of the parallel window and
    # buys a tests job that does not rebuild Go.
    needs: [native, compile]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Restore the native layer
        # [MINIS-OZEL] `path: .` was wrong. upload-artifact v4 does NOT keep
        # workspace-relative paths; it stores every file relative to the COMMON
        # ANCESTOR of the uploaded paths, which here is `src/android/app`. The
        # artifact therefore contains `libs/rclone.aar`, `src/main/assets/...`
        # and nothing else — so unpacking at the repo root produced
        # `./libs/rclone.aar` and the check below failed on a good build.
        # Extracting into `src/android/app` puts each file exactly where the
        # upload found it.
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: src/android/app

      - name: Check rclone.aar arrived
        run: |
          test -f src/android/app/libs/rclone.aar || {
            echo "FAIL: rclone.aar missing — Gradle cannot resolve :rclone:"
            exit 1
          }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        # [MINIS-X ci-cache] ONE key for both jobs, and that is the whole point:
        # the tests job compiles the same Kotlin the build job needs, so a shared
        # entry turns the build's compile into a cache hit. It used to be
        # `gradle-tests-<hash>` here and `gradle-<hash>` there — the primary keys
        # could never match, every job restored the other's entry and re-saved
        # its own, and the build recompiled from scratch every time.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/android/.gradle
            src/android/app/build
          key: gradle-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/**/*.toml') }}
          # `restore-keys` still matches the old names, so the first run after
          # this change warms up instead of starting cold.
          restore-keys: |
            gradle-tests-
            gradle-

      - name: Raise JVM heap for the runner
        working-directory: src/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Fork tests (blocking)
        # Our own code, our own tests. A red here is a regression in something
        # this fork added and upstream will never test.
        working-directory: src/android
        run: |
          chmod +x gradlew
          LOG="$GITHUB_WORKSPACE/build/logs/tests.log"
          mkdir -p "$(dirname "$LOG")"
          # [H-013] Bu adım .54'te 429 yüzünden kırmızı çıktı; aynı sarmalayıcı.
          bash ../../scripts/ci/gradle_retry.sh "$LOG" \
            ./gradlew :app:testGithubDebugUnitTest --tests 'com.openminis.app.ozel.*' --stacktrace

      # [37094] A red test is the case where the HTML report and the raw console
      # log matter most, so both are uploaded unconditionally.
      - name: Scrub secrets from the logs
        # [37094] Same reason as the other jobs: the artifact copy of a log is
        # not masked, so it is scrubbed before it leaves the runner.
        if: always()
        continue-on-error: true
        run: python3 scripts/scrub_logs.py build/logs

      - name: Upload run logs and test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-tests
          path: |
            build/logs/**
            src/android/app/build/reports/tests/**
            src/android/app/build/test-results/**
          retention-days: 90
          if-no-files-found: warn

      # Upstream's 721 test files are NOT run here any more. They took 612 s of
      # the old pipeline to produce a result that could not fail anything
      # (`continue-on-error`), and they gate nothing about this fork's own
      # behaviour. They now run in .github/workflows/upstream-tests.yml on a
      # schedule and on demand, where ten minutes cost nothing. Losing them
      # from the per-push path costs no coverage; keeping them there cost half
      # the wall clock.
  # [MINIS-OZEL] Native dependencies are their own layer, built in parallel.
  #
  # These are C and Go trees that depend on neither the Kotlin sources nor the
  # app's resources: proot + talloc (~2 s of small C), the Alpine rootfs (a
  # download), and rclone.aar (2 min of Go + gomobile). Inside the APK job they
  # were a serial prefix to every build and were re-run for a one-line Compose
  # change. As a layer they run once, in parallel with the tests, and the APK
  # job consumes the result.
  #
  # Wall clock becomes max(native + build, tests) instead of
  # native + build + tests.
  native:
    name: Native dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Init proot submodule
        run: |
          git submodule update --init --depth 1 deps/proot
          ls -la deps/proot | sed -n '1,5p'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false  # the explicit cache step below covers bin/ and mod/

      - name: Install NDK for the proot cross-build
        # r28 only: this job compiles proot and talloc, nothing through CMake.
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          ls "$SDK/ndk"

      - name: Cache Alpine rootfs
        # [MINIS-X ci-cache] `prepare_android_sandbox.sh` already skips the
        # download when the tarball is present — it just never was, because
        # every runner starts empty. Keyed on the pinned release, so a version
        # bump invalidates it and nothing else does.
        id: rootfs-cache
        uses: actions/cache@v4
        with:
          path: src/android/app/src/main/assets/alpine-minirootfs.tar.gz
          key: rootfs-${{ hashFiles('scripts/prepare_android_sandbox.sh') }}

      - name: Cache Go modules and gomobile
        # gomobile + gobind are rebuilt from source on every run (~30-45 s) and
        # the module cache is re-downloaded with them. Both are pinned by the Go
        # version, so go.sum + go-version is the right key.
        id: go-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-gomobile

      - name: Install gomobile
        run: |
          if [ -x "$(go env GOPATH)/bin/gomobile" ]; then
            echo "gomobile already restored from cache"
          else
            go install golang.org/x/mobile/cmd/gomobile@latest
            go install golang.org/x/mobile/cmd/gobind@latest
          fi
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Native cache key
        # Everything the rclone build depends on, and nothing that changes on
        # every commit. See scripts/ci/native_cache_key.sh for the reasoning.
        id: native
        run: echo "key=$(sh scripts/ci/native_cache_key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore rclone.aar
        id: rclone-cache
        uses: actions/cache@v4
        with:
          path: src/android/app/libs/rclone.aar
          key: rclone-${{ steps.native.outputs.key }}

      - name: Build proot + Alpine rootfs
        # ~2 s: small C trees, all four cores, no dependency to fetch. Caching
        # this would cost more in restore than it saves — hence uncached, on
        # purpose, and this comment is why that is not an oversight.
        run: |
          LOG="$GITHUB_WORKSPACE/build/logs/native.log"
          mkdir -p "$(dirname "$LOG")"
          ./deps/build_proot.sh 2>&1 | tee -a "$LOG"
          ./scripts/prepare_android_sandbox.sh 2>&1 | tee -a "$LOG"
          ls -la src/android/app/src/main/jniLibs/arm64-v8a/ | tee -a "$LOG"
          ls -la src/android/app/src/main/assets/ 2>&1 | sed -n '1,12p' | tee -a "$LOG"

      - name: Build rclone.aar
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x deps/build_rclone_android.sh
          LOG="$GITHUB_WORKSPACE/build/logs/native.log"
          mkdir -p "$(dirname "$LOG")"
          ./deps/build_rclone_android.sh 2>&1 | tee -a "$LOG"
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          ls -la src/android/app/libs/ | tee -a "$LOG"

      - name: Upload the native layer
        uses: actions/upload-artifact@v4
        with:
          name: native-deps
          path: |
            src/android/app/libs/rclone.aar
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
          retention-days: 7
          if-no-files-found: error

      # [37094] The native layer is where "it downloaded everything again" shows
      # up. The log says which cache failed to restore and why — and, because
      # these files outlive the Actions UI, they are scrubbed before upload.
      - name: Scrub secrets from the logs
        if: always()
        continue-on-error: true
        run: python3 scripts/scrub_logs.py build/logs

      - name: Upload run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-native
          path: build/logs/**
          retention-days: 90
          if-no-files-found: warn


  build:
    name: Android APK (${{ inputs.build_type || 'release' }})
    # The fast gate answers in seconds; letting the 10-minute build start first
    # would mean paying for the whole compile before a one-line fix is known.
    # The native layer arrives as an artifact. Depending on both keeps the
    # pipeline at max(native + build, tests) instead of native + build + tests,
    # since preflight finishes long before native does.
    needs: [preflight, native, version-gate, compile, tests]
    # [37094] The only job that writes: softprops/action-gh-release creates the
    # release the in-app updater polls. Scoped here instead of workflow-wide.
    permissions:
      contents: write
    # [MINIS-OZEL 11.4] `tests` is in `needs` now that publishing is automatic.
    # Before, a release run whose test job was RED still built and PUBLISHED:
    # the run said "failure" while the APK was already on the release page, so
    # the in-app updater offered a build the tests had just rejected — the
    # worst of both outcomes. Building nothing is the honest result: no APK, no
    # release, nothing to install.
    #
    # The price is the parallel window: the APK no longer builds beside the
    # tests, so a run takes ~6 minutes longer. Accepted deliberately, and for
    # debug runs too — a debug APK is never published, but it exists to be
    # inspected, and inspecting a tree whose tests fail is work done twice.
    # "Nothing is built unless everything is green" is one rule, not two.
    #
    # [MINIS-OZEL] ...with one exception, and it is not a loosening of that rule:
    # `version-gate` is SKIPPED on a debug dispatch (it only asks "may this run
    # publish"). A skipped entry in `needs` skips the dependent job by default,
    # so a `build_type=debug` dispatch could never produce an APK at all — the
    # job appeared as a skipped "Android APK" entry at 0s,
    # and looked like an unrelated GitHub quirk. The explicit `if` below says
    # what was always meant: run unless something FAILED or was CANCELLED.
    # A red `tests` still stops the build, which is the rule that matters.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (the proot submodule is built in the native job)
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Restore the native layer
        # [MINIS-OZEL] `path: src/android/app`, not `.`. The old comment here
        # claimed upload-artifact keeps workspace-relative paths; v4 strips the
        # common ancestor instead, so the artifact holds `libs/rclone.aar`,
        # `src/main/assets/...`, `src/main/jniLibs/...` — relative to
        # `src/android/app`. Unpacking at the root scattered them one level too
        # high and the step below died on rclone.aar. Since the artifact now
        # lands exactly where it was uploaded from, the "Place" step no longer
        # moves anything; it only verifies.
        uses: actions/download-artifact@v4
        with:
          name: native-deps
          path: src/android/app

      - name: Verify the native layer
        # Nothing is moved any more — the download lands in src/android/app,
        # which is where these files lived when they were uploaded. This step
        # exists only to fail loudly on an incomplete layer: Gradle would
        # otherwise finish and produce an APK whose every shell command returns
        # exit -1, because the proot loaders are what the installer puts in
        # nativeLibraryDir.
        run: |
          set -e
          for f in src/android/app/libs/rclone.aar \
                   src/android/app/src/main/assets/proot-aarch64 \
                   src/android/app/src/main/assets/alpine-minirootfs.tar.gz \
                   src/android/app/src/main/jniLibs/arm64-v8a/libproot.so \
                   src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so \
                   src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so; do
            test -s "$f" || { echo "FAIL: native layer missing $f"; exit 1; }
          done
          ls -la src/android/app/libs/ src/android/app/src/main/assets/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK + CMake + SDK 36
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          # Only NDK 27 here. AGP 8.7.3 resolves the app's CMake JNI build
          # (pty_bridge, crash handler, jieba_jni) to 27.0.12077973. NDK r28 was
          # only ever needed by deps/build_proot.sh, which now runs in the
          # native job — so this job no longer downloads a second 1 GB NDK.
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
                "ndk;27.0.12077973" "cmake;${CMAKE_VERSION}"
          ls "$SDK/ndk"

      - name: Prepare signing key
        # [MINIS-OZEL] This USED TO WARN AND CONTINUE, and that was the worst
        # failure mode in the release path. Without the secret the build fell
        # back to the debug key and then published to the SAME tag as the real
        # release, replacing it. Every installed copy then refused the update
        # (UpdateSignatureGuard, and the OS itself: a different signer cannot
        # install over an existing package), and the good APK was gone from
        # under that tag — so there was no way back except a new versionCode.
        #
        # A release that cannot be signed with our key must not exist at all.
        # `debug` builds are the exception: they are never published.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$BUILD_TYPE" = "debug" ]; then
              echo "::warning::No keystore secret — debug build will use the debug key"
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release cannot be"
            echo "::error::signed with the fork key, and a debug-signed APK published"
            echo "::error::under our tag would be uninstallable for every existing user."
            echo "::error::Set the four signing secrets (see FORK.md §4) and re-run."
            exit 1
          fi
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty — an incomplete signing config produces an"
              echo "::error::APK that installs nowhere. Set all four secrets."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minis-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/minis-release.p12" >> $GITHUB_ENV
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Gradle cache
        # Same key as the tests job on purpose — see the note there. Restoring
        # `app/build` is what makes the APK step skip its own compile instead of
        # doing the work a second time.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/android/.gradle
            src/android/app/build
          key: gradle-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/**/*.toml') }}
          restore-keys: |
            gradle-tests-
            gradle-

      - name: Raise JVM heap for the runner (repo defaults assume 2 GB)
        working-directory: src/android
        run: |
          {
            echo ""
            echo "# --- CI only: the hosted runner has 16 GB, the repo default 2 GB OOMs ---"
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=4"
            echo "# [MINIS-OZEL] Reuse task outputs across builds and run modules in"
            echo "# parallel. Without the build cache every CI run recompiles the same"
            echo "# 776 Kotlin files from scratch. Gradle's local build cache lives"
            echo "# under ~/.gradle/caches/build-cache-1, which the cache step above"
            echo "# already persists, so no extra path is needed."
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "kotlin.incremental=true"
            echo "ksp.incremental=true"
          } >> gradle.properties
          cat gradle.properties

      - name: Identity guard
        run: bash scripts/check_identity.sh

      - name: Resource string sanity
        # A single unescaped apostrophe in a translated string fails resource
        # flattening with "Invalid unicode escape sequence", ~40 s into the
        # build and only for the locale that has it. Catching it here costs a
        # second and names the exact file and line.
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          bad = []
          for f in pathlib.Path('src/android/app/src/main/res').rglob('strings.xml'):
              for n, line in enumerate(f.read_text(encoding='utf-8').split('\n'), 1):
                  if '<string' not in line:
                      continue
                  for i, ch in enumerate(line):
                      if ch == "'" and (i == 0 or line[i-1] != '\\'):
                          bad.append(f'{f}:{n}: unescaped apostrophe')
                          break
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('resource strings OK')
          PY

      - name: Assemble APK
        # `--build-cache` + `--parallel` on a warm cache is what turns a repeat
        # build of unchanged Kotlin from ~7 min into ~1. The first build after a
        # source change still pays full price; every build that only touches
        # resources, strings or a single file does not.
        working-directory: src/android
        run: |
          chmod +x gradlew
          LOG="$GITHUB_WORKSPACE/build/logs/assemble.log"
          mkdir -p "$(dirname "$LOG")"
          BT="${{ inputs.build_type || 'release' }}"
          if [ "$BT" = "debug" ]; then
            TASK=":app:assembleGithubDebug"
          else
            TASK=":app:assembleGithubRelease"
          fi
          ./gradlew $TASK --build-cache --parallel --stacktrace 2>&1 | tee -a "$LOG"

      - name: Verify APK contents
        working-directory: src/android
        env:
          BTYPE: ${{ inputs.build_type || 'release' }}
        run: |
          set -e
          # [37094] No `| head` / `| grep -q` anywhere in this step. Both exit
          # before their producer finishes, the producer dies of SIGPIPE (141),
          # and under the pipefail set at the top of this file that turns a
          # PASSING check into a red step — the worst possible failure mode for
          # a release gate, because it only shows up on the release run. So:
          # capture each tool's output once, then match with bash `case`, which
          # reads a variable instead of a pipe.
          APK=$(find app/build/outputs/apk -name 'app-github-*.apk' | sed -n '1p')
          [ -n "$APK" ] || { echo "FAIL: no APK produced under app/build/outputs/apk"; exit 1; }
          echo "checking $APK"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          [ -d "$BT" ] || BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | sed -n '$p')
          [ -x "$BT/aapt2" ] || { echo "FAIL: no aapt2 under $ANDROID_HOME/build-tools"; exit 1; }
          echo "build-tools: $BT"

          # 1. identity really landed (one aapt2 call, not three)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,2p'
          case "$BADGING" in
            *"package: name='com.minis.x'"*) : ;;
            *) echo "FAIL: applicationId not applied"; exit 1 ;;
          esac
          # 2. signature is ours and verifies
          #
          # DEBUG BUILDS ARE NOT SIGNED WITH THE RELEASE KEY, by design (they
          # are throwaway verification builds). Asserting the release
          # certificate unconditionally made every debug dispatch on a branch
          # fail AFTER a green compile, which reads as "the branch is broken"
          # while the only thing that happened is that the debug keystore did
          # what it is for. The release identity is still checked below, in the
          # release path only, where publishing actually happens.
          CERTS=$("$BT/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERTS" | sed -n '1,6p'
          if [ "${BTYPE:-release}" = "debug" ]; then
            echo "debug build — signing identity not asserted (only release is)"
          else
            case "$CERTS" in
              *3e62d262631a8182167bfb22df64ae413286257fc6e6a77a08c6ced0bc0bb6c9*) : ;;
              *) echo "FAIL: not signed with the Minis Ozel key"; exit 1 ;;
            esac
          fi
          # 3-4. contents: one `unzip -l`, matched in memory
          LIST=$(unzip -l "$APK")
          # 3. the proot loaders must be inside or every shell command returns exit -1
          for so in libproot.so libproot-loader.so libproot-loader32.so; do
            case "$LIST" in
              *"lib/arm64-v8a/$so"*) : ;;
              *) echo "FAIL: lib/arm64-v8a/$so missing from APK"; exit 1 ;;
            esac
          done
          # 4. the sandbox must ship its rootfs
          case "$LIST" in
            *assets/alpine-minirootfs*) : ;;
            *) echo "FAIL: alpine rootfs missing from APK"; exit 1 ;;
          esac
          echo "APK checks passed"

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p out
          BT="$ANDROID_HOME/build-tools/36.0.0"
          # The in-app updater reads the APK FILE NAME as its protocol:
          #   MinisApp-<versionName>-build<versionCode>-<abi>.apk
          # (UpdatePolicy.kt APK_NAME). The versionCode it parses from the name
          # is what it compares against the installed build, and the installer
          # re-checks the archive's own versionCode before handing it to the
          # package manager. So the name MUST carry both, or the app silently
          # reports "up to date" forever — which is what app-release.apk did.
          APK=$(find src/android/app/build/outputs/apk -name 'app-github-release.apk' | sed -n '1p')
          [ -n "$APK" ] || APK=$(find src/android/app/build/outputs/apk -name 'app-github-*.apk' | sed -n '1p')
          echo "source apk: $APK"
          BADGING=$("$BT/aapt2" dump badging "$APK" | sed -n '1p')
          VERSION_CODE=$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          VERSION_NAME=$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          [ -n "$VERSION_CODE" ] || { echo "FAIL: could not read versionCode"; exit 1; }
          OUT="out/MinisApp-${VERSION_NAME}-build${VERSION_CODE}-arm64-v8a.apk"
          cp -v "$APK" "$OUT"
          ls -la out/
          echo "### $OUT"
          "$BT/aapt2" dump badging "$OUT" 2>/dev/null | sed -n '1,2p' || true
          "$BT/apksigner" verify --print-certs "$OUT" 2>&1 | sed -n '1,6p' || true
          sha256sum "$OUT"
          echo "MINIS_APK_NAME=$(basename "$OUT")" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "MINIS_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-ozel-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      # Runs last and with a hard budget: a non-blocking step still blocks the
      # artifact upload when it hangs, and the full upstream suite takes 20+ min.
      - name: Build the release notes from commits
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        id: notes
        run: |
          set -e
          # The checkout above is depth=1 (the build does not need history),
          # so fetch just what the notes need. Shallow-fetching tags alongside
          # the branch is enough to find the previous version tag.
          # [MINIS-X release-notes] `origin main` was the wrong ref: the release
          # is built from whatever branch the run targets, and its commits are
          # usually NOT on main yet. On a shallow checkout that made the previous
          # tag unreachable, the range fell back to HEAD~20..HEAD, and a depth-1
          # clone could not even supply that — the notes came out with one line.
          # Fetch the tags (any depth) and unshallow just enough of THIS branch.
          git fetch --tags origin >/dev/null 2>&1 || true
          git fetch --deepen=200 origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            git fetch origin "$GITHUB_REF_NAME" >/dev/null 2>&1 || true

          # Group the commits since the previous version tag by type, so the
          # release reads as "what changed" rather than GitHub's default list
          # of every merge commit. Conventional-commit prefixes are what the
          # rest of this repo already uses (see CONTRIBUTING.md §4).
          PREV=$(git tag --list 'v*' --sort=-v:refname | sed -n '1p' || true)
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            RANGE="$PREV..HEAD"
            echo "notes: since $PREV"
          else
            RANGE="HEAD~20..HEAD"
            echo "notes: no reachable previous tag, using the last 20 commits"
          fi

          {
            echo "body<<__NOTES_EOF__"
            echo ""
            # feat
            FEAT=$(git log "$RANGE" --no-merges --pretty=%s | grep -E '^feat' || true)
            if [ -n "$FEAT" ]; then
              echo "### Yeni"
              echo ""
              echo "$FEAT" | sed -E 's/^feat(\([^)]*\))?: /- /'
              echo ""
            fi
            # fix
            FIX=$(git log "$RANGE" --no-merges --pretty=%s | grep -E '^fix' || true)
            if [ -n "$FIX" ]; then
              echo "### Düzeltmeler"
              echo ""
              echo "$FIX" | sed -E 's/^fix(\([^)]*\))?: /- /'
              echo ""
            fi
            # everything else that is user-facing
            OTHER=$(git log "$RANGE" --no-merges --pretty=%s | grep -E '^(perf|refactor)' || true)
            if [ -n "$OTHER" ]; then
              echo "### İyileştirmeler"
              echo ""
              echo "$OTHER" | sed -E 's/^(perf|refactor)(\([^)]*\))?: /- /'
              echo ""
            fi
            echo "---"
            echo ""
            echo "Kurulum: \`com.minis.x\` — resmî Minis'in yanına kurulur."
            echo "Tam değişiklik listesi: [FORK.md §10](https://github.com/${{ github.repository }}/blob/main/FORK.md#10-değişiklik-günlüğü)."
            echo ""
            echo "_Derleme: \`${{ github.sha }}\`_"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Tag audit — published tags must point at their own commit
        # [H-012] `tag-denetim.py` bu depoda vardı ama Ozel Guard'da
        # `--strict` olmadan çağrılıyordu: beş etiket yanlış commit'i
        # gösteriyordu ve hiçbir tur kırmızı olmadı. "Rapor eden ama kırmızı
        # olmayan kontrol, kapı değil günlüktür."
        #
        # Yayın anı, bunun kontrol edilebileceği tek yer: sonradan yakalamak
        # için etiketleri silip yeniden atmak gerekir.
        run: python3 scripts/ozel/tag-denetim.py --strict

      - name: Release gate — never reuse a published versionCode
        id: release_gate
        # [MINIS-OZEL] The tag is derived from versionName, and the release
        # action UPSERTS: a second build of the same version replaces the
        # first one's APK under the same tag. Two consequences, both silent:
        #
        #   - nobody updates, because the versionCode in the file name did not
        #     change, so UpdatePolicy.isNewer says "up to date";
        #   - the APK that WAS there is gone, so anyone who had not installed
        #     it yet can no longer get it.
        #
        # So: if a release already exists for this tag, the versionCode must be
        # strictly greater than the one it published. Bumping the version is
        # the only way to publish again, which is the rule the version scheme
        # in FORK.md §6 already implied.
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # [37094] Read the version from the SHELL environment, not from
          # the env expression context. "Collect artifacts" exports these through
          # $GITHUB_ENV, and that is guaranteed to reach the shell of the next
          # step; whether it also lands in the `env` expression context is a
          # detail of the runner. The shell form has no such question, and the
          # gate now publishes the tag itself as a step OUTPUT, so the release
          # action never depends on the env context either.
          TAG="v${MINIS_VERSION_NAME:-}"
          CODE="${MINIS_VERSION_CODE:-}"
          [ -n "${MINIS_VERSION_NAME:-}" ] || { echo "::error::MINIS_VERSION_NAME is empty — Collect artifacts did not run"; exit 1; }
          [ -n "$CODE" ] || { echo "::error::MINIS_VERSION_CODE is empty — Collect artifacts did not run"; exit 1; }
          # A tag of bare "v" would publish a release that every later build
          # tries to replace; refuse before anything is created.
          if [ "$TAG" = "v" ]; then
            echo "::error::versionName resolved to nothing — refusing to publish tag 'v'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$MINIS_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "gate: tag=$TAG versionCode=$CODE"
          # [37094] Same fail-open fix as the version gate: a failed query is
          # not an empty release. Publishing is irreversible (the updater
          # replaces whatever is under that tag), so an unverified gate refuses.
          ERR=$(mktemp)
          set +e
          EXISTING=$(gh release view "$TAG" --repo "${{ github.repository }}" \
              --json assets --jq '.assets[].name' 2>"$ERR")
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            if grep -qiE 'not found|HTTP 404' "$ERR"; then
              echo "gate: no release for $TAG yet — publishing"
              exit 0
            fi
            echo "::error::could not query releases for $TAG (gh exit $RC):"
            sed -n '1,5p' "$ERR"
            echo "::error::refusing to publish on an unverified gate"
            exit 1
          fi
          if [ -z "$EXISTING" ]; then
            echo "gate: release exists but has no assets — publishing"
            exit 0
          fi
          echo "gate: existing assets:"; echo "$EXISTING"
          OLD=$(echo "$EXISTING" | sed -n 's/.*-build\([0-9]*\)-.*/\1/p' | sed -n '1p')
          if [ -z "$OLD" ]; then
            echo "gate: existing release has no build number in its asset name — refusing to replace it"
            exit 1
          fi
          if [ "$CODE" -le "$OLD" ]; then
            echo "::error::$TAG already published build $OLD; this build is $CODE."
            echo "::error::Publishing would replace the existing APK without giving anyone"
            echo "::error::an update. Bump versionCode/versionName and re-run."
            exit 1
          fi
          echo "gate: $OLD -> $CODE, allowed"

      - name: Publish release (this is what the in-app updater reads)
        # Runs for every release build, not just tags. The updater polls
        # GitHub Releases of RELEASE_REPO and compares the versionCode parsed
        # from the APK file name against its own, so a build that never becomes
        # a release is a build the user can only install by hand.
        #
        # tag_name is derived from the versionName (v1.15-ozel.2), so repeated
        # builds of the same version replace the same release instead of piling
        # up entries the updater would have to choose between.
        if: ${{ (inputs.build_type || 'release') == 'release' }}
        # [37094] Pinned to a commit, not `@v2`. This is the only THIRD-PARTY
        # action in the repo and it is handed `contents: write` — a moving tag
        # means whoever controls that tag can rewrite the publisher of every
        # APK the user installs. Bumping it is a deliberate act: resolve the new
        # v2 commit, replace the SHA, keep the comment.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # [37094] From the gate's OUTPUT, not the env expression context. The gate already
          # proved the name is non-empty and refused a bare "v"; reading the
          # same value here through a different mechanism was how a release
          # tagged "v" could slip through on a runner that does not mirror
          # $GITHUB_ENV into the env context.
          tag_name: ${{ steps.release_gate.outputs.tag }}
          # [37099] KÖK SEBEP — "5 etiket yanlış commit'i gösteriyor" gizemi.
          #
          # `target_commitish` verilmezse action-gh-release etiketi **deponun
          # varsayılan dalına** (`main`) yaratır, derlenen commit'e değil.
          # Bizim `main` upstream'de takılı kaldı (`ffeb948` = 11.2), yani
          # BÜTÜN yayın etiketleri oraya işaret etti:
          #   v1.15-ozel.11.3.1 / .11.4 / .13 / .14 / .15 / .18 → hepsi ffeb948
          # `tag-denetim.py` bunu altı kez "yanlış commit" diye raporladı ama
          # sebebi görünmüyordu; düzeltme "etiketi sil, yeniden hedefle" diye
          # planlanmıştı (geri dönüşsüz, ertelendi). Gerçek düzeltme burada:
          # etiket derlenen commit'e bağlanır.
          #
          # Neden `github.sha` ve neden doğru: bu iş, o commit'in ağacından
          # derlenmiş APK'yı yayınlıyor. Etiketin başka bir commit'i göstermesi,
          # indirilen APK ile "kaynak şu commit" iddiasının ayrışması demek.
          target_commitish: ${{ github.sha }}
          name: Minis X ${{ steps.release_gate.outputs.name }}
          files: out/*.apk
          # Stable channel: UpdatePolicy.STABLE refuses a prerelease, so publishing
          # our own builds as prereleases would hide them from the in-app updater.
          prerelease: false
          make_latest: true
          # [MINIS-OZEL] Notes come from the commits, not from GitHub's default
          # merge-commit list. generate_release_notes would be ignored anyway
          # once body is set.
          body: ${{ steps.notes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # [37094] The run summary is the part a human actually reads before
      # opening a 20 000-line log: which version, how big, which hash. It lives
      # on the run page, so it survives as long as the run does — and unlike
      # the log it is in the URL preview.
      - name: Run summary
        if: always()
        run: |
          {
            echo "## Minis X derlemesi"
            echo ""
            echo "| alan | değer |"
            echo "|---|---|"
            echo "| sürüm | ${MINIS_VERSION_NAME:-?} / ${MINIS_VERSION_CODE:-?} |"
            echo "| tür | ${{ inputs.build_type || 'release' }} |"
            if [ -n "${MINIS_APK_NAME:-}" ] && [ -f "out/$MINIS_APK_NAME" ]; then
              echo "| boyut | $(wc -c < "out/$MINIS_APK_NAME") bayt |"
              echo "| sha256 | \`$(sha256sum "out/$MINIS_APK_NAME" | cut -d' ' -f1)\` |"
            else
              echo "| apk | üretilmedi |"
            fi
            echo "| koşu | ${GITHUB_RUN_ID} |"
            echo ""
            echo "Loglar: \`run-logs-build\` artifact (90 gün). Yayın gövdesi kalıcı."
          } >> "$GITHUB_STEP_SUMMARY"

      # [37094] Last step in the job, and unconditional. If PUBLISHING failed,
      # this is the only artifact a later reader gets — including the reason.
      - name: Scrub secrets from the logs
        # [37094] GitHub masks secrets in the LIVE log stream only. These files
        # are the copy that survives, and artifact contents are not masked. A
        # `tee` that captures everything therefore needs a scrub before upload.
        if: always()
        continue-on-error: true
        run: python3 scripts/scrub_logs.py build/logs

      - name: Upload run logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-build
          path: |
            build/logs/**
            build/reports/**
          retention-days: 90
          if-no-files-found: warn
