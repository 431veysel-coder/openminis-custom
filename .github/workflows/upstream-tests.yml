name: Upstream Tests

# [MINIS-OZEL] Upstream's unit suite, off the per-push path.
#
# These 721 test files describe upstream's behaviour, not this fork's. Running
# them on every push cost 612 seconds — 10.2 of the pipeline's 21.4 minutes —
# and produced a result that could not fail anything (`continue-on-error`). A
# test that cannot fail a build but can cost ten minutes is a nightly job, not
# a gate.
#
# They still matter: a fork that stops compiling and passing upstream's tests
# has drifted somewhere worth knowing about, usually at the next rebase. That
# is exactly what a scheduled run reports, and a red one here is a signal to
# look before syncing, not a reason to hold a release.
#
# A full run also needs the native layer (rclone.aar is a Gradle dependency),
# which is why this workflow carries the same rclone cache as apk.yml instead
# of depending on its artifact.

on:
  schedule:
    - cron: '0 3 * * *'   # daily, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  upstream-tests:
    name: Upstream unit tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Native cache key
        id: native
        run: echo "key=$(sh scripts/ci/native_cache_key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore rclone.aar
        uses: actions/cache@v4
        with:
          path: src/android/app/libs/rclone.aar
          key: rclone-${{ steps.native.outputs.key }}

      - name: Build rclone.aar if the cache missed
        if: steps.rclone-cache.outputs.cache-hit != 'true'
        run: |
          # A cold cache means a fresh runner has to produce the Go archive
          # before Gradle can resolve :rclone:. Fewer steps than the native job
          # because nothing here needs proot or the rootfs.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV

          curl -sSL https://go.dev/dl/go1.25.0.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          export PATH="/usr/local/go/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"

          chmod +x deps/build_rclone_android.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-upstream-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Raise JVM heap
        working-directory: src/android
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            echo "kotlin.daemon.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
          } >> gradle.properties

      - name: Run the full suite
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testGithubDebugUnitTest --build-cache --parallel --stacktrace

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-test-reports
          path: |
            src/android/app/build/reports/tests/**
            src/android/app/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore
